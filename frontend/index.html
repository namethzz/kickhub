  <!-- Set the theme before first paint so dark-mode users never see a white flash. Keep in sync with src/lib/theme.js. -->
  <script>try{var c=localStorage.getItem('kh-theme');var d=c==='dark'||(c!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';var m=document.querySelector('meta[name="theme-color"]');if(m&&d)m.setAttribute('content','#0d1511')}catch(e){}</script>
