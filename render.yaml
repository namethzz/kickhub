# MongoDB is hosted separately on Atlas. No credentials belong in this file.
services:
  - type: web
    name: kickhub-api
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Render's proxy adds one X-Forwarded-For hop; login rate limits need the real client IP.
      - key: TRUST_PROXY
        value: 1
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
  - type: web
    name: kickhub-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
